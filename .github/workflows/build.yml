name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Build
        run: gradle build --no-daemon
      - name: Dump API (debug)
        if: always()
        run: |
          J=$(find ~/.gradle -name 'minecraft*.jar' -not -name '*sources*' -size +5M | head -1)
          echo "jar: $J"
          javap -cp "$J" net.minecraft.client.gui.components.ChatComponent | grep -i -E "message|add" || true
          javap -cp "$J" net.minecraft.client.player.LocalPlayer | grep -i -E "message" || true
      - uses: actions/upload-artifact@v4
        with:
          name: GhostTracker-fabric-26.1.2
          path: build/libs/GhostTracker-fabric-*.jar
